<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Posto de Combustiveis</title>
</head>
<body>

    <script>
    let modelo = prompt("Digite o modelo do veiculo:");
    let placa = prompt("Digite a placa do veiculo:");
    let tipoCombustivel = prompt("Digite o tipo de combustivel (ETANOL ou GASOLINA):");
    let valorLitro = parseFloat(prompt("Digite o valor do litro em reais:"));
    let quantidadeLitros = parseFloat(prompt("Digite a quantidade de litros abastecidos:"));

    let valorTotal = valorLitro * quantidadeLitros;
    let imposto = valorTotal * 0.25;
    let dataHora = new Date().toLocaleString();

    let relatorio = " *RELATORIO DE ABASTECIMENTO *\n\n" +
    "Data e Hora do abastecimento -> " + dataHora + "\n" +
    "Placa do Veiculo -> " + placa + "\n" +
    "Tipo de Combustivel -> " + tipoCombustivel + "\n" +
    "Valor do Litro -> R$ " + valorLitro.toFixed(2) + "\n" +
    "Quantidade de litros abastecidos -> " + quantidadeLitros.toFixed(2) + "\n" +
    "Valor Total a Pagar -> R$ " + valorTotal.toFixed(2) + "\n\n" +
    "Observacao: Valor do Imposto = R$ " + imposto.toFixed(2) + " (25% do valor total do abastecimento)";

    alert(relatorio);
    </script>

</body>
</html>
